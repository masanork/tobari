[package]
name = "tobari-crypto-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "sha256", "ecdh"] }
sha2 = "0.10.9"
hkdf = "0.12.4"
rand = { version = "0.8", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
hex = "0.4"
rand_core = { version = "0.10.0-rc.6", optional = true }
ml-dsa = { version = "0.1.0-rc.3", optional = true }
ml-kem = { version = "0.1.1", optional = true }
kem = { version = "0.3.0-pre.0", optional = true }

[features]
default = ["pqc_dsa"]
pqc_dsa = ["dep:ml-dsa", "dep:rand_core"]
pqc_kem = ["dep:ml-kem", "dep:kem"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

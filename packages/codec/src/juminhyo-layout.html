<div class="official-document">
    <div class="header">
        <div class="title">{{証明書名称}}</div>
        <!-- バッジを削除し、純粋な書類の顔立ちに -->
    </div>

    <table class="main-table">
        <tr>
            <td class="label" colspan="6">住所</td>
            <td class="value" colspan="34">{{世帯住所}}</td>
        </tr>
        <tr>
            <td class="label" colspan="6">世帯主</td>
            <td class="value" colspan="34">{{世帯主氏名}}</td>
        </tr>
    </table>

    <div class="members-container">
        {{#each 世帯員}}
        <div class="member-entry">
            <table class="member-table">
                <tr>
                    <td class="side-label" rowspan="3">員<br>{{@index + 1}}</td>
                    <td class="label">氏名</td>
                    <td class="value name-val">{{氏名}}</td>
                    <td class="label">個人番号</td>
                    <td class="value">{{個人番号}}</td>
                </tr>
                <tr>
                    <td class="label">生年月日</td>
                    <td class="value">{{生年月日}}</td>
                    <td class="label">性別</td>
                    <td class="value">{{性別}}</td>
                    <td class="label">続柄</td>
                    <td class="value">{{続柄}}</td>
                </tr>
                <tr>
                    <td class="label">本籍</td>
                    <td class="value" colspan="5">{{#join 本籍}}<br>{{/join}}</td>
                </tr>
            </table>
        </div>
        {{/each}}
    </div>

    <div class="footer">
        <div class="issuer-info">
            この写しは、原本と相違ないことを証明する。<br>
            {{交付年月日}}<br>
            <span class="issuer-name">{{発行者役職}} {{発行者氏名}}</span>
            <span class="official-seal">印</span>
        </div>
        <!-- 技術的なメタデータは、検証が必要な人だけがフッターで確認できる程度に -->
        <div class="meta-info"
            style="font-size: 9px; color: #ccc; margin-top: 20px; border-top: 1px solid #eee; padding-top: 5px;">
            ID: {{schema_id}} / Sig: ES384 / Issued: {{created_at}}
        </div>
    </div>
</div>

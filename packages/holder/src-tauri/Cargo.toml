[package]
name = "tobari-holder"
version = "0.1.0"
description = "Tobari Identity Holder"
authors = ["masanork"]
edition = "2021"

[lib]
name = "tobari_holder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
civ = { path = "../../civ" }
anyhow = "1.0"
sha2 = "0.10"
ciborium = "0.2.2"
aes-gcm = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh", "serde", "arithmetic"] }
rand = "0.8"
hex = "0.4"
bbs = "0.4.1"
bls12_381 = "0.8.0"
uuid = { version = "1.19.0", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
# authenticator crate for interacting with security keys / OS APIs
authenticator = "0.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
authenticator = { version = "0.5.0", optional = true, default-features = false, features = ["crypto_rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
authenticator = { version = "0.5.0", optional = true, default-features = false, features = ["crypto_rust"] }
security-framework = "2.9.1"
security-framework-sys = "2.9.1"

[features]
default = ["macos-authenticator"]
linux-authenticator = ["dep:authenticator"]
macos-authenticator = ["dep:authenticator"]

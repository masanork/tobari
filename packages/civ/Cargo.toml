[package]
name = "civ"
version = "0.1.0"
edition = "2021"
authors = ["Masanori Kiyokawa <masanork@gmail.com>"]
description = "A universal identity verification library (Rust) supporting JPKI (Japan), ICAO 9303 (ePassport), Drivers License, and ISO-7816 smart cards."
license = "MIT OR Apache-2.0"
repository = "https://github.com/masanork/tobari/tree/main/packages/civ"
keywords = ["jpki", "myna", "smartcard", "pcsc", "civid"]
categories = ["cryptography", "authentication", "hardware-support"]
default-run = "civ"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
base64 = "0.21"
sha1 = "0.10"
sha2 = "0.10"
des = "0.8"
cbc = "0.1"
cipher = "0.4"
encoding_rs = "0.8"
aes = "0.8"
cmac = "0.7"
# Crypto
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
signature = "2.2"
x509-parser = "0.15"
der-parser = "8.2"
zeroize = "1.7"

rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
mockall = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pcsc = "2.8"
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
rpassword = "7.3"

    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));

        start(controller) { controller.enqueue(bin); controller.close(); }
    }).pipeThrough(new DecompressionStream("gzip"));
    const text = await new Response(stream).text();
    return text;
}

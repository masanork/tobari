            width: 100%;
            display: flex;

            background: white;
            width: 100%;

            min-height: 100vh;

                padding: 0;

                box-shadow: none;
                border: none;
                margin: 0;
                padding: 10mm;
                max-width: none;
                min-height: auto;
            }

            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;

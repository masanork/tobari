        * {
            box-sizing: border-box;

        body {
            background: #f8fafc;
            /* Force the subset font with a serif fallback */
            font-family: "TobariSubset", "IPAMJMincho", serif;
            color: #1a202c;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        #viewer-root {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .official-document {
            background: white;
            width: 100%;
            max-width: 1000px;
            min-height: 100vh;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            position: relative;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .official-document {
                box-shadow: none;
                border: none;
                margin: 0;
                padding: 10mm;
                max-width: none;
                min-height: auto;
            }
        }

        .error {
            color: #c53030;
            padding: 30px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            font-family: sans-serif;
            max-width: 600px;
        }

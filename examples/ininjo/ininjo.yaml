meta:
  title: "委任状 (児童手当受給に関する権限委任)"
  version: "2.0"
  security: "high"

fields:
  - key: destination
    type: text
    label: "宛先"
    readonly: true
    val: "千代田区長 殿"

  - key: mandator_section
    type: group
    label: "委任者 (本人)"
    fields:
      - key: name
        type: text
        label: "氏名"
        required: true
        autofill: "jpki:name"
      - key: address
        type: text
        label: "住所"
        required: true
        autofill: "jpki:address"
      - key: birthday
        type: date
        label: "生年月日"
        required: true
        autofill: "jpki:birthDate"

  - key: proxy_section
    type: group
    label: "受任者 (代理人)"
    fields:
      - key: proxy_name
        type: text
        label: "代理人 氏名"
        required: true
        placeholder: "例：戸張 次郎"
      - key: proxy_address
        type: text
        label: "代理人 住所"
        required: true
        placeholder: "東京都..."

  - key: authority_scope
    type: textarea
    label: "委任する事項"
    required: true
    val: "児童手当の認定請求、受給に関する一切の権限を上記代理人に委任します。"
    readonly: true
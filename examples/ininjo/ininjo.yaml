title: "電子委任状"
id: "io.github.masanork.tobari.ininjo.v1"
version: "1.0.0"

fields:
  - id: "id"
    label: "委任状ID"
    type: "string"
    section: "header"
  - id: "creationTime"
    label: "作成日時"
    type: "string"
    section: "header"

  - id: "mandator"
    label: "委任者"
    type: "group"
    fields:
      - id: "type"
        label: "区分"
        type: "string"
        selective: true
      - id: "name"
        label: "氏名又は名称"
        type: "string"
        selective: true
      - id: "address"
        label: "住所又は所在地"
        type: "string"
        selective: true
      - id: "kanaName"
        label: "カナ"
        type: "string"
        selective: true
      - id: "birthDate"
        label: "生年月日"
        type: "string"
        selective: true
      - id: "tradeName"
        label: "屋号"
        type: "string"
        selective: true
      - id: "identificationId"
        label: "識別ID"
        type: "string"
        selective: true
      - id: "corporateNumber"
        label: "法人番号"
        type: "string"
        selective: true
      - id: "representativeTitle"
        label: "代表者肩書"
        type: "string"
        selective: true

  - id: "mandatary"
    label: "受任者"
    type: "group"
    fields:
      - id: "type"
        label: "区分"
        type: "string"
        selective: true
      - id: "name"
        label: "氏名又は名称"
        type: "string"
        selective: true
      - id: "address"
        label: "住所又は所在地"
        type: "string"
        selective: true
      - id: "birthDate"
        label: "生年月日"
        type: "string"
        selective: true
      - id: "tradeName"
        label: "屋号"
        type: "string"
        selective: true
      - id: "identificationId"
        label: "識別ID"
        type: "string"
        selective: true
      - id: "department"
        label: "所属"
        type: "string"
        selective: true
      - id: "title"
        label: "役職"
        type: "string"
        selective: true

  - id: "delegatedAuthority"
    label: "委任内容"
    type: "group"
    fields:
      - id: "validityPeriod"
        label: "有効期間"
        type: "group"
        selective: true
        fields:
          - id: "startDate"
            label: "開始日"
            type: "string"
          - id: "endDate"
            label: "終了日"
            type: "string"

      - id: "delegatedActs"
        label: "委任行為"
        type: "array"
        selective: true
        items:
          type: "group"
          fields:
            - id: "actName"
              label: "手続名称"
              type: "string"
            - id: "note"
              label: "備考"
              type: "string"

      - id: "subDelegation"
        label: "復代理"
        type: "group"
        selective: true
        fields:
          - id: "allocated"
            label: "権限有無"
            type: "boolean"

  - id: "provider"
    label: "事業者情報"
    type: "group"
    fields:
      - id: "serviceName"
        label: "サービス名"
        type: "string"
      - id: "policyUrl"
        label: "ポリシーURL"
        type: "string"
      - id: "revocationUrl"
        label: "有効性確認URL"
        type: "string"

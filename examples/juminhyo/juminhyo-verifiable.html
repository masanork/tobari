            box-sizing: border-box;

        body {
            background: #e2e8f0;
            /* Force the subset font with a serif fallback */
            font-family: "TobariSubset", "IPAMJMincho", "MS Mincho", "Hiragino Mincho ProN", serif;
            color: #1a1a1a;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        #viewer-root {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .official-document {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 25mm 20mm;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .official-document {
                box-shadow: none;
                border: none;
                margin: 0;
                padding: 15mm 15mm;
            }
        }

        .error {
            color: #c53030;
            padding: 30px;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 8px;
            font-family: sans-serif;
            max-width: 600px;

  en: Crypto Account Ownership Credential
description:
  ja: 本人確認済みの自己管理型ウォレットアカウント一覧の証明
  en: Verified ownership of self-hosted crypto accounts across multiple chains.

fields:
  - id: accounts
    name:
      ja: 保有アカウント一覧
      en: Owned Accounts
  - id: verification_level
    name:
      ja: 本人確認レベル
      en: Verification Level
  - id: issuance_date
    name:
      ja: 発行日
      en: Issuance Date
  - id: family_name
    name:
      ja: 姓
      en: Family Name
  - id: given_name
    name:
      ja: 名
      en: Given Name
  - id: birth_date
    name:
      ja: 生年月日
      en: Date of Birth
  - id: document_type
    name:
      ja: 本人確認書類
      en: Identity Document
  - id: identity_proof_type
    name:
      ja: 真正性証明方式
      en: Identity Proof Type
  - id: identity_proof
    name:
      ja: 真正性証明データ
      en: Identity Proof Data

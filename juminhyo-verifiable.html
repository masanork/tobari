        body {
            background: #f0f2f5;
            font-family: "TobariSubset", "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .official-document {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #d1d9e0;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.1em;
        }

        .status-badge {
            background: #e6f4ea;
            color: #1e7e34;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #c3e6cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1.5px solid #000;
            margin-bottom: 10px;
        }

        td {
            border: 1px solid #000;
            padding: 8px 12px;
            font-size: 14px;
        }

        .label {
            background: #f8f9fa;
            width: 15%;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .side-label {
            background: #f8f9fa;
            width: 40px;
            text-align: center;
            font-weight: bold;
        }

        .name-val {
            font-size: 20px;
            font-weight: bold;
        }

        .member-entry {
            margin-top: -1px;
        }

        .footer {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .issuer-info {
            line-height: 2;
            font-size: 15px;
        }

        .issuer-name {
            font-size: 18px;
            font-weight: bold;
            margin-right: 10px;
        }

        .official-seal {
            display: inline-flex;
            width: 36px;
            height: 36px;
            border: 1.5px solid #d93025;
            color: #d93025;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
        }

        .meta-info {
            font-size: 10px;
            color: #888;
            text-align: right;
        }

        .error {
            color: #d93025;
            padding: 20px;
            background: #fce8e6;
            border-radius: 8px;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>
